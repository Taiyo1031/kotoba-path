# GitHub Pages へデプロイするワークフロー。
name: Deploy to GitHub Pages

# main と、確認用の feat/phase3 へのプッシュと、手動実行で発火する。
# (main が空の間は feat/phase3 から公開する。main に統合したら feat/phase3 は外す。)
on:
  push:
    branches: [main, feat/phase3]
  workflow_dispatch:

# Pages デプロイに必要な権限を指定する。
permissions:
  contents: read
  pages: write
  id-token: write

# 同じグループのデプロイを並行しない。
concurrency:
  group: pages
  cancel-in-progress: false

# ビルドとデプロイのジョブを定義する。
jobs:
  # ビルドして成果物をアップロードする。
  build:
    runs-on: ubuntu-latest
    steps:
      # リポジトリをチェックアウトする。
      - uses: actions/checkout@v4
      # Node.js をセットアップする。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 依存関係をインストールする。
      - run: npm ci
      # Lint を実行する。
      - run: npm run lint
      # テストを実行する。
      - run: npm run test
      # ビルドして dist を生成する。
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      # GitHub Pages の設定を行う。
      - uses: actions/configure-pages@v5
      # 成果物をアップロードする。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # GitHub Pages にデプロイする。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages の環境を指定する。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # デプロイを実行する。
      - id: deployment
        uses: actions/deploy-pages@v4
